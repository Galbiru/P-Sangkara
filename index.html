<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalyndra Project</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --water-primary: #0088cc;
            --water-deep: #005580;
            --water-light: #e0f7fa;
            --water-cyan: #00bcd4;
            --glass-bg: rgba(255, 255, 255, 0.88);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-main: #1a3644;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: 
                radial-gradient(circle at top left, rgba(0, 188, 212, 0.3), transparent 50%),
                radial-gradient(circle at bottom right, rgba(0, 85, 128, 0.4), transparent 50%),
                linear-gradient(135deg, #b2ebf2 0%, #e0f7fa 40%, #80deea 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            color: var(--text-main);
        }

        /* Container Card */
        .card-container {
            width: 100%;
            max-width: 620px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 26px;
            border: 1px solid var(--glass-border);
            padding: 36px 28px;
            box-shadow: 0 20px 45px rgba(0, 85, 128, 0.2);
            position: relative;
            z-index: 10;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .view-section.active {
            display: block;
        }

        /* Header & Navigation Buttons */
        .view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(0, 136, 204, 0.15);
        }

        .back-btn {
            background: rgba(0, 136, 204, 0.1);
            color: var(--water-deep);
            border: none;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--water-primary);
            color: white;
        }

        .page-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--water-deep);
            text-align: center;
            flex-grow: 1;
        }

        /* STEP 1: Welcome Page */
        #view-welcome {
            text-align: center;
            padding: 20px 10px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 188, 212, 0.15);
            color: var(--water-deep);
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .welcome-title {
            font-family: 'Roboto Mono', monospace;
            font-size: 2.1rem;
            font-weight: 700;
            color: var(--water-deep);
            line-height: 1.25;
            margin-bottom: 10px;
        }

        .welcome-sub {
            font-size: 0.95rem;
            color: #456a7b;
            margin-bottom: 28px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--water-cyan), var(--water-primary));
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.35);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(0, 136, 204, 0.45);
            background: linear-gradient(135deg, var(--water-primary), var(--water-deep));
        }

        /* Grid Selection Layout */
        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-top: 10px;
        }

        .option-card {
            background: white;
            border: 1px solid rgba(0, 188, 212, 0.25);
            padding: 18px 14px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--water-deep);
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 85, 128, 0.06);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .option-card:hover {
            background: var(--water-primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 136, 204, 0.3);
            border-color: var(--water-primary);
        }

        /* Final Action Layout */
        .final-action-container {
            text-align: center;
            padding: 25px 10px;
        }

        .city-badge {
            display: inline-block;
            background: #e0f7fa;
            color: var(--water-deep);
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 999px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* Grid Interviewer khusus Jakarta */
        .interviewer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .interviewer-btn {
            background: white;
            color: var(--water-deep);
            border: 1px solid rgba(0, 188, 212, 0.3);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
        }

        .interviewer-btn:hover {
            background: var(--water-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 136, 204, 0.25);
        }

        /* Background Water Bubbles */
        .floating-bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.2);
            pointer-events: none;
            animation: floatUp 8s infinite linear;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
            30% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .card-container { padding: 26px 18px; }
            .welcome-title { font-size: 1.7rem; }
            .option-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- STEP 1: WELCOME SCREEN -->
        <div id="view-welcome" class="view-section active">
            <div class="brand-badge">ACORN CONSULTANT</div>
            <h1 class="welcome-title">Welcome to<br>Kalyndra Project</h1>
            <p class="welcome-sub">Akses survey terorganisir untuk seluruh wilayah operasional.</p>
            <button class="btn-main" id="btn-start">
                <span>CLICK FOR NEXT</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- STEP 2: PILIH PULAU -->
        <div id="view-island" class="view-section">
            <div class="view-header">
                <button class="back-btn" onclick="showView('view-welcome')">
                    <i class="fa-solid fa-chevron-left"></i> Kembali
                </button>
                <div class="page-title">Pilih Wilayah (Pulau)</div>
                <div style="width: 75px;"></div>
            </div>
            <div class="option-grid">
                <div class="option-card" onclick="selectIsland('Jawa')">
                    <i class="fa-solid fa-map-location-dot"></i> Jawa
                </div>
                <div class="option-card" onclick="selectIsland('Sumatra')">
                    <i class="fa-solid fa-map-location-dot"></i> Sumatra
                </div>
                <div class="option-card" onclick="selectIsland('Bali')">
                    <i class="fa-solid fa-map-location-dot"></i> Bali
                </div>
            </div>
        </div>

        <!-- STEP 3: PILIH KOTA -->
        <div id="view-city" class="view-section">
            <div class="view-header">
                <button class="back-btn" onclick="showView('view-island')">
                    <i class="fa-solid fa-chevron-left"></i> Kembali
                </button>
                <div class="page-title" id="city-title">Pilih Kota</div>
                <div style="width: 75px;"></div>
            </div>
            <div class="option-grid" id="city-grid">
                <!-- Kota diisi dinamis via JS -->
            </div>
        </div>

        <!-- STEP 4A: KHUSUS JAKARTA (LIST INTERVIEWER) -->
        <div id="view-jakarta" class="view-section">
            <div class="view-header">
                <button class="back-btn" onclick="showView('view-city')">
                    <i class="fa-solid fa-chevron-left"></i> Kembali
                </button>
                <div class="page-title">Interviewer Jakarta</div>
                <div style="width: 75px;"></div>
            </div>
            <div class="interviewer-grid" id="interviewer-list">
                <!-- Interviewer diisi via JS -->
            </div>
        </div>

        <!-- STEP 4B: KOTA LAIN (PRESS FOR THE LINK) -->
        <div id="view-other-city" class="view-section">
            <div class="view-header">
                <button class="back-btn" onclick="showView('view-city')">
                    <i class="fa-solid fa-chevron-left"></i> Kembali
                </button>
                <div class="page-title">Akses Link Survey</div>
                <div style="width: 75px;"></div>
            </div>
            <div class="final-action-container">
                <div class="city-badge" id="selected-city-label">Kota Selected</div>
                <p style="font-size: 0.9rem; color: #557788; margin-bottom: 24px;">Silakan klik tombol di bawah untuk membuka form survey resmi.</p>
                <a id="direct-survey-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-main" style="text-decoration: none;">
                    <span>PRESS FOR THE LINK</span>
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
        const SURVEY_LINK = "https://survey.xmfactory.com/survey?b=1028876&l=8e75e4f6954cd665";

        const cityData = {
            Jawa: ["Jakarta", "Bandung", "Yogyakarta", "Semarang", "Surabaya", "Surakarta"],
            Sumatra: ["Medan", "Palembang", "Padang"],
            Bali: ["Ubud", "Kuta", "Jimbaran", "Nusa Dua"]
        };

        const interviewers = [
            "Sri Suwarti", "Bebi Agustin", "Evie Bungai", "Fransiska",
            "Hermes", "Lisa Halim", "Putri Wahyu", "Dewi Chovizo"
        ];

        let selectedIsland = "";

        document.getElementById('btn-start').addEventListener('click', () => {
            showView('view-island');
        });

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function selectIsland(island) {
            selectedIsland = island;
            const cityGrid = document.getElementById('city-grid');
            document.getElementById('city-title').textContent = `Kota di ${island}`;
            cityGrid.innerHTML = '';

            cityData[island].forEach(city => {
                const btn = document.createElement('div');
                btn.className = 'option-card';
                btn.innerHTML = `<i class="fa-solid fa-city"></i> ${city}`;
                btn.onclick = () => selectCity(city);
                cityGrid.appendChild(btn);
            });

            showView('view-city');
        }

        function selectCity(city) {
            if (city === "Jakarta") {
                renderInterviewerList();
                showView('view-jakarta');
            } else {
                document.getElementById('selected-city-label').textContent = `Wilayah: ${city} (${selectedIsland})`;
                document.getElementById('direct-survey-btn').href = SURVEY_LINK;
                showView('view-other-city');
            }
        }

        function renderInterviewerList() {
            const listContainer = document.getElementById('interviewer-list');
            listContainer.innerHTML = '';

            interviewers.forEach((name, index) => {
                const a = document.createElement('a');
                a.className = 'interviewer-btn';
                a.href = SURVEY_LINK;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.innerHTML = `
                    <span>${index + 1}. ${name}</span>
                    <i class="fa-solid fa-arrow-right"></i>
                `;
                listContainer.appendChild(a);
            });
        }

        // Animated Water Bubbles
        function createWaterBubbles() {
            const bubbleCount = 14;
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'floating-bubble';
                const size = Math.random() * 35 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 95}vw`;
                bubble.style.animationDuration = `${Math.random() * 6 + 6}s`;
                bubble.style.animationDelay = `${Math.random() * 4}s`;
                document.body.appendChild(bubble);
            }
        }

        createWaterBubbles();
    </script>
</body>
</html>
